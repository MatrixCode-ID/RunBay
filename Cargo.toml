[package]
name = "runbay"
version = "1.0.0-alpha.1"
edition = "2024"
description = "Build and run your applications from one place."
license = "MIT"
repository = "https://github.com/MatrixCode-ID/RunBay"
publish = false

[lib]
name = "runbay"
path = "src/lib.rs"

[[bin]]
name = "runbay"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "image-default-formats",
    "raw-window-handle-06",
] }
raw-window-handle = "0.6.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tray-icon = "0.26.1"
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vte = "0.15.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
log = "0.4.34"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
]

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
